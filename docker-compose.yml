services:
  postgres:
    image: postgres:16-alpine
    container_name: investigation_platform_db
    environment:
      POSTGRES_USER: investigation
      POSTGRES_PASSWORD: password
      POSTGRES_DB: investigation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigation -d investigation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: